name: muchakucha-zwei-test

services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-muchakucha_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-muchakucha_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-muchakucha_test_only}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-test-data:/var/lib/postgresql


volumes:
  postgres-test-data:
