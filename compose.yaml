name: muchakucha-zwei-test

services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-muchakucha_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-muchakucha_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-muchakucha_test_only}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-test-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      - "${TEST_MAILPIT_SMTP_PORT:-11025}:1025"
      - "${TEST_MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:8025/readyz
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - mailpit-test-data:/data

volumes:
  postgres-test-data:
  mailpit-test-data:
